name: Build Windows exe

# 手动触发的 Windows 构建：产出可直接运行的 exe，不打包安装器。
# 与 release.yml 的区别：不生成 updater 产物，因此无需 TAURI_SIGNING_PRIVATE_KEY，
# 在没有仓库 secrets 的 fork 上也能跑通。
#
# workflow_dispatch 的“Run workflow”按钮只有在工作流文件位于默认分支时才会出现，
# 因此这里额外挂 push 触发：功能分支推上去即可直接构建，无需先把文件合进 main。
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Cargo profile (debug 快很多，release 体积小但编译慢)"
        type: choice
        default: debug
        options:
          - debug
          - release
  push:
    branches:
      - "fix/**"
      - "feat/**"
      - "ci/**"

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

# push 触发时没有 inputs：默认 debug（快），提交信息带 [release] 时才走 release。
# release profile 是 lto + codegen-units=1 + opt-level="s"，编译很慢，不宜作为
# 每次推送的默认值。
env:
  PROFILE: ${{ inputs.profile || (contains(github.event.head_commit.message, '[release]') && 'release' || 'debug') }}

# 发布 prerelease 需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ env.PROFILE }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-${{ env.PROFILE }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri.conf.json 的 beforeBuildCommand 已包含 build:renderer，无需单独构建前端。
      # --no-bundle 跳过 NSIS/WiX 与 updater 签名，直接产出裸 exe。
      - name: Build
        run: pnpm tauri build --no-bundle ${{ env.PROFILE == 'debug' && '--debug' || '' }}

      - name: Collect exe
        shell: pwsh
        run: |
          $dir = "src-tauri/target/${{ env.PROFILE }}"
          $exe = Get-ChildItem -Path $dir -Filter *.exe -File -ErrorAction SilentlyContinue
          if (-not $exe) {
            Write-Error "No exe produced in $dir"
            exit 1
          }
          $exe | ForEach-Object { "{0}  ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB) }
          New-Item -ItemType Directory -Force out | Out-Null
          $exe | Copy-Item -Destination out

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cc-switch-windows-${{ env.PROFILE }}
          path: out/*.exe
          if-no-files-found: error
          retention-days: 14

      # Artifact 下载会被重定向到 *.blob.core.windows.net，该域名在部分企业网络里
      # 被拦截，点下载只得到一个空白页。Release 资产走 objects.githubusercontent.com，
      # 与平时下载 Release 同一条链路，可绕开这个限制。
      - name: Publish exe as prerelease asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev-${{ env.PROFILE }}-${{ github.run_number }}
          name: "Dev build ${{ env.PROFILE }} #${{ github.run_number }}"
          body: |
            Unsigned development build — not for distribution.

            - commit: ${{ github.sha }}
            - branch: ${{ github.ref_name }}
            - profile: ${{ env.PROFILE }}

            Windows may show a SmartScreen warning because the binary is unsigned.
          prerelease: true
          files: out/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
